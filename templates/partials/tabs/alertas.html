    <!-- TAB ALERTAS -->
    <div id="tab-alertas" style="display:none;">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <select id="alerta-filtro-estado" class="form-select form-select-sm" style="width:140px;"
                        onchange="cargarAlertas()">
                    <option value="pendiente">Pendientes</option>
                    <option value="">Todas</option>
                    <option value="resuelta">Resueltas</option>
                    <option value="ignorada">Ignoradas</option>
                </select>
                <select id="alerta-filtro-severidad" class="form-select form-select-sm" style="width:140px;"
                        onchange="cargarAlertas()">
                    <option value="">Todas las severidades</option>
                    <option value="critica">Crítica</option>
                    <option value="media">Media</option>
                    <option value="informativa">Informativa</option>
                </select>
                <select id="alerta-filtro-tipo" class="form-select form-select-sm" style="width:140px;"
                        onchange="cargarAlertas()">
                    <option value="">Todos los tipos</option>
                    <option value="cobertura">Cobertura</option>
                    <option value="calidad">Calidad</option>
                    <option value="emisiones">Emisiones</option>
                    <option value="documentacion">Documentación</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary" onclick="cargarAlertas()">
                    <i class="fa-solid fa-refresh me-1"></i>Actualizar
                </button>
                <button class="btn btn-sm text-white" style="background:var(--primary);"
                        onclick="generarAlertas()">
                    <i class="fa-solid fa-bolt me-1"></i>Analizar ahora
                </button>
            </div>
        </div>

        <!-- Resumen alertas -->
        <div class="row g-3 mb-4" id="alertas-resumen-row">
            <div class="col-6 col-md-3">
                <div class="kpi-card red">
                    <div class="kpi-num" id="al-criticas">—</div>
                    <div class="kpi-lbl"><i class="fa-solid fa-triangle-exclamation me-1"></i>Críticas</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card orange">
                    <div class="kpi-num" id="al-medias">—</div>
                    <div class="kpi-lbl"><i class="fa-solid fa-circle-exclamation me-1"></i>Medias</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card">
                    <div class="kpi-num" id="al-informativas">—</div>
                    <div class="kpi-lbl"><i class="fa-solid fa-circle-info me-1"></i>Informativas</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="kpi-card green">
                    <div class="kpi-num" id="al-resueltas">—</div>
                    <div class="kpi-lbl"><i class="fa-solid fa-check-circle me-1"></i>Resueltas</div>
                </div>
            </div>
        </div>

        <!-- Lista de alertas -->
        <div id="alertas-lista">
            <div class="text-center text-muted py-4">
                <i class="fa-solid fa-bell fa-2x mb-2 d-block"></i>Pulsa "Analizar ahora" para detectar alertas
            </div>
        </div>
    </div>
