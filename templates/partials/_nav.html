    <script>
        // La pestaña Admin solo se muestra si ALLOW_ADMIN_MAESTROS=true.
        // La visibilidad se decide en el cliente consultando /api/admin/estado,
        // para no requerir cambios en el renderizado Jinja del servidor.
        (function(){
            fetch('/api/admin/estado').then(function(r){return r.json();}).then(function(d){
                if(d && d.exito && d.admin_habilitado){
                    var li=document.getElementById('nav-admin-item');
                    if(li){ li.style.display=''; }
                }
            }).catch(function(){ /* si falla, admin queda oculto */ });
        })();
    </script>
