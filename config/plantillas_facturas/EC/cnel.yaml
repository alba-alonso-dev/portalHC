version_esquema: 2

codigo: cnel
nombre_canonico: "CNEL EP"
pais: EC

categoria: comercializadora

campos_disponibles:
  - consumo
  - periodo
  - fecha_factura
  - tarifa
  - contrato
  - importe
  - sociedad
  - direccion

# Plantilla NUEVA: sede de Guayaquil.
patrones_deteccion:
  - "Corporación Nacional de Electricidad"
  - "CNEL EP"
  - "CNEL"

reglas_extraccion:

  # OJO: la tabla de CNEL lleva una columna numérica MÁS que la de EEQ y la
  # unidad va en mayúsculas ('KWH' frente a 'kWh'). Reutilizar el patrón de
  # eeq.yaml aquí devolvería la columna equivocada.
  consumo:
    patron: 'Energ[íi]a\s+activa\s+total\s+\d{2}-\d{2}-\d{4}\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+([\d.,]+)\s+KWH'
    confianza: 0.92
    agregacion: primer_grupo

  periodo:
    patron: 'Fecha\s+desde\s+(\d{2}-\d{2}-\d{4})\s+Fecha\s+hasta\s+(\d{2}-\d{2}-\d{4})'
    confianza: 0.95

  fecha_factura:
    patron: 'Fecha\s+de\s+emisi[óo]n\s*:?\s*(\d{2}-\d{2}-\d{4})'
    confianza: 0.92

  tarifa:
    patron: 'Tipo\s+de\s+tarifa\s+Arconel\s+(\S+)'
    confianza: 0.90

  contrato:
    patron: 'CUENTA\s+CONTRATO\s*(\d+)'
    confianza: 0.92

  # Ver nota en eeq.yaml: el rótulo va sin dos puntos. Verificado en 6/6.
  sociedad:
    patron: 'Raz[óo]n\s+social\s*:?\s*([A-ZÁÉÍÓÚÑ][^\n]{4,60})'
    confianza: 0.90

  direccion:
    patron: 'Direcci[óo]n\s+del\s+servicio\s+([^\n]{8,90})'
    confianza: 0.90

  importe:
    patron: 'VALOR\s+TOTAL\s*\$?\s*([\d.,]+)'
    confianza: 0.90
